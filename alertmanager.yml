# Alertmanager configuration.
# The receivers below are placeholders that drop alerts. Wire each one to a
# real integration (PagerDuty, Slack, email, webhook, ...) before relying on
# it in any environment.
# See: https://prometheus.io/docs/alerting/latest/configuration/

route:
  receiver: "default"
  group_by: ["alertname", "job", "cl_name", "rs_nm"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    # Heartbeat: send to an external dead man's switch (e.g. healthchecks.io,
    # PagerDuty/Opsgenie heartbeat) so a dead pipeline is detected.
    - matchers: ['alertname="Watchdog"']
      receiver: "deadmansswitch"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    - matchers: ['severity="critical"']
      receiver: "pager"

    - matchers: ['severity="warning"']
      receiver: "ticket"

    # Single elections are expected during Atlas maintenance, so they are
    # info-only and muted during the maintenance window.
    - matchers: ['severity="info"']
      receiver: "ticket"
      mute_time_intervals: ["atlas-maintenance"]

# Set this to the Atlas project's maintenance window (Project Settings ->
# Maintenance Window). Atlas times are in the project's time zone; Alertmanager
# uses UTC unless `location` is set.
time_intervals:
  - name: atlas-maintenance
    time_intervals:
      - weekdays: ["saturday"]
        times:
          - start_time: "02:00"
            end_time: "06:00"
        location: "UTC"

inhibit_rules:
  # A critical alert suppresses the warning for the same signal on the same
  # target (e.g. AtlasDiskUsageCritical silences AtlasDiskUsageHigh), but not
  # unrelated warnings on that node.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["signal", "job", "cl_name", "rs_nm", "instance", "disk_name"]

  # When a node cannot be scraped, its other alerts are noise.
  - source_matchers: ['alertname="AtlasScrapeTargetDown"']
    target_matchers: ['alertname=~"Atlas.+"', 'alertname!="AtlasScrapeTargetDown"']
    equal: ["job", "instance"]

receivers:
  - name: "default"
  - name: "deadmansswitch"
  - name: "pager"
  - name: "ticket"
