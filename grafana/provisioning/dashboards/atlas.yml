# Grafana dashboard provisioning.
# Loads every JSON file in /var/lib/grafana/dashboards (mounted from
# ./grafana/dashboards) into the "MongoDB Atlas" folder on startup.
# Docs: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards

apiVersion: 1

providers:
  - name: atlas
    folder: MongoDB Atlas
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
