# =============================================================================
# Prometheus Configuration for MongoDB Atlas
# Based on Atlas Prometheus Integration best practices
# Requires: Atlas M10+ cluster with Prometheus integration enabled
# =============================================================================

global:
  scrape_interval: 60s         # Atlas metrics update every 60s; scraping faster wastes bandwidth
  evaluation_interval: 60s     # Align rule evaluation with scrape cadence
  scrape_timeout: 30s

  # Applied to all time series -- useful for multi-cluster or multi-team setups
  external_labels:
    monitor: "atlas-prometheus"
    org: "your-org-name"       # Replace with your organization name

# =============================================================================
# Alertmanager Integration
# =============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# =============================================================================
# Recording and Alerting Rules
# =============================================================================
rule_files:
  - "rules/atlas_recording_rules.yml"
  - "rules/atlas_alerting_rules.yml"
  - "rules/atlas_meta_alerting_rules.yml"

# =============================================================================
# Org-wide Atlas jobs (one per project), generated by scripts/atlas_org_sync.py.
# Re-run the script (e.g. from cron) to pick up new projects; it reloads
# Prometheus when given --reload-url.
# =============================================================================
scrape_config_files:
  - "scrape_configs/*.yml"

# =============================================================================
# Scrape Configurations
# =============================================================================
scrape_configs:

  # Self-monitoring: required by atlas_meta_alerting_rules.yml
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # ---------------------------------------------------------------------------
  # MongoDB Atlas Federation Endpoint -- Production Clusters
  # ---------------------------------------------------------------------------
  - job_name: "mongodb_atlas_production"

    scheme: https
    metrics_path: /metrics

    basic_auth:
      username: "REPLACE_WITH_PROD_ATLAS_USERNAME"
      password_file: /etc/prometheus/secrets/atlas_password_production

    http_sd_configs:
      - url: https://cloud.mongodb.com/prometheus/v1.0/groups/REPLACE_WITH_PROD_ATLAS_GROUP_ID/discovery
        refresh_interval: 2m
        basic_auth:
          username: "REPLACE_WITH_PROD_ATLAS_USERNAME"
          password_file: /etc/prometheus/secrets/atlas_password_production

    # --- Target Relabeling (before scrape) ---
    # Enrich all metrics with team context at scrape time.
    # Do not set `region`, `provider`, `cl_name`, etc. here: Atlas already
    # exposes them, and a target label would overwrite the real values.
    # The same applies to `environment` when it is an Atlas resource tag
    # (Send Resource Tags = On); the rules group by it. Uncomment the
    # `environment` rule only if your project does not send that tag.
    # There is no cluster_tier label: a job covers every cluster in the
    # project, and tiers differ per cluster (and change with auto-scaling).
    relabel_configs:
      - target_label: team
        replacement: "platform-engineering"                 # Replace with your team

      - source_labels: [__address__]
        target_label: hostname

      # - target_label: environment
      #   replacement: "production"

    # --- Metric Relabeling (after scrape, before storage) ---
    metric_relabel_configs:

      # -- DROP: Go runtime and process metrics exposed by the Atlas agent
      - source_labels: [__name__]
        regex: "go_.*|promhttp_.*|process_.*"
        action: drop

      # -- KEEP: Atlas/MongoDB metrics backing the top-20 recording and alerting
      # rules. This intentionally keeps all mongodb_* series so the config works
      # across Atlas metric-name revisions and customer-specific metric surfaces.
      - source_labels: [__name__]
        regex: "mongodb_.*|atlas_.*|hardware_.*|QUERY_TARGETING_.*"
        action: keep

      # Keep process_port: on sharded clusters mongod, mongos, and config
      # processes share a host, and dropping it makes their series collide.

  # ---------------------------------------------------------------------------
  # MongoDB Atlas Federation Endpoint -- Staging Clusters (leaner config)
  # ---------------------------------------------------------------------------
  - job_name: "mongodb_atlas_staging"

    scheme: https
    metrics_path: /metrics

    basic_auth:
      username: "REPLACE_WITH_STAGING_ATLAS_USERNAME"
      password_file: /etc/prometheus/secrets/atlas_password_staging

    http_sd_configs:
      - url: https://cloud.mongodb.com/prometheus/v1.0/groups/REPLACE_WITH_STAGING_ATLAS_GROUP_ID/discovery
        refresh_interval: 2m
        basic_auth:
          username: "REPLACE_WITH_STAGING_ATLAS_USERNAME"
          password_file: /etc/prometheus/secrets/atlas_password_staging

    relabel_configs:
      - target_label: team
        replacement: "platform-engineering"
      - source_labels: [__address__]
        target_label: hostname
      # - target_label: environment
      #   replacement: "staging"
    metric_relabel_configs:
      # Staging: keep the same top-20 inputs so dashboards and alerts work in
      # pre-production. Tighten this only after confirming which rules you use.
      - source_labels: [__name__]
        regex: "go_.*|promhttp_.*|process_.*"
        action: drop

      - source_labels: [__name__]
        regex: "mongodb_.*|atlas_.*|hardware_.*|QUERY_TARGETING_.*"
        action: keep

