# Unit tests for the Atlas rules. Run with:
#   promtool test rules tests/*.test.yml

rule_files:
  - ../atlas_recording_rules.yml
  - ../atlas_alerting_rules.yml
  - ../atlas_meta_alerting_rules.yml

evaluation_interval: 1m

tests:

  # Average read latency of 150ms at 1 op/s -> warning, not critical.
  - interval: 1m
    input_series:
      - series: 'mongodb_opLatencies_reads_latency{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '0+9000000x20'
      - series: 'mongodb_opLatencies_reads_ops{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '0+60x20'
    promql_expr_test:
      - expr: node:mongodb_oplatencies_reads:avg_usec
        eval_time: 10m
        exp_samples:
          - labels: 'node:mongodb_oplatencies_reads:avg_usec{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
            value: 150000
    alert_rule_test:
      - alertname: AtlasReadLatencyCritical
        eval_time: 10m
        exp_alerts: []

  # Low traffic (0.1 op/s) must not dilute latency: 300ms per op stays 300ms.
  - interval: 1m
    input_series:
      - series: 'mongodb_opLatencies_writes_latency{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '0+1800000x20'
      - series: 'mongodb_opLatencies_writes_ops{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '0+6x20'
    promql_expr_test:
      - expr: node:mongodb_oplatencies_writes:avg_usec
        eval_time: 10m
        exp_samples:
          - labels: 'node:mongodb_oplatencies_writes:avg_usec{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
            value: 300000

  # Idle node: no ops means no latency sample (and no alert), not 0.
  - interval: 1m
    input_series:
      - series: 'mongodb_opLatencies_reads_latency{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '0x20'
      - series: 'mongodb_opLatencies_reads_ops{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '0x20'
    promql_expr_test:
      - expr: node:mongodb_oplatencies_reads:avg_usec
        eval_time: 10m
        exp_samples: []

  # A single election triggers the detection alert but not the frequent one.
  # Both nodes change role (n1 becomes primary, n2 steps down); that must
  # count as one election, not two.
  - interval: 1m
    input_series:
      # Atlas flips the rs_state label on election, so the old series goes
      # stale and a new one appears.
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n1:27017",rs_state="2"}'
        values: '1x10 stale'
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n1:27017",rs_state="1"}'
        values: '_x10 0x30'
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="1"}'
        values: '0x10 stale'
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="2"}'
        values: '_x10 1x30'
    alert_rule_test:
      - alertname: AtlasFrequentPrimaryElections
        eval_time: 30m
        exp_alerts: []
      - alertname: AtlasPrimaryElectionDetected
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              severity: info
              signal: elections
              job: atlas
              cl_name: c1
              rs_nm: rs0
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#elections"
              summary: "Atlas primary election detected"
              description: "Replica set rs0 elected a new primary in the last 15 minutes."
              context: "cluster=c1 rs=rs0 instance= node_type= rs_state= az= region="

  # Two elections within an hour (n1 takes over, then n2 takes back) trigger
  # the frequent-elections alert.
  - interval: 1m
    input_series:
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n1:27017",rs_state="2"}'
        values: '1x10 stale _x9 1x20'
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n1:27017",rs_state="1"}'
        values: '_x10 0x9 stale'
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="1"}'
        values: '0x10 stale _x9 0x20'
      - series: 'mongodb_repl_secondary{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="2"}'
        values: '_x10 1x9 stale'
    alert_rule_test:
      - alertname: AtlasFrequentPrimaryElections
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              severity: critical
              signal: elections
              job: atlas
              cl_name: c1
              rs_nm: rs0
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#elections"
              summary: "Atlas frequent primary elections detected"
              description: "Replica set rs0 elected a new primary more than once in the last hour."
              context: "cluster=c1 rs=rs0 instance= node_type= rs_state= az= region="

  # Meta alerts: scrape failure and missing rule inputs.
  - interval: 1m
    input_series:
      - series: 'up{job="mongodb_atlas_production",instance="n1:27017"}'
        values: '0x10'
      - series: 'up{job="mongodb_atlas_production",instance="n2:27017"}'
        values: '1x20'
    alert_rule_test:
      - alertname: AtlasScrapeTargetDown
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: critical
              job: mongodb_atlas_production
              instance: "n1:27017"
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#scrape-target-down"
              summary: "Atlas scrape target down"
              description: "Prometheus cannot scrape n1:27017 (job mongodb_atlas_production). Check Atlas credentials, group ID, and IP access list. Atlas alerts for this node are blind."
      - alertname: AtlasScrapeTargetsMissing
        eval_time: 10m
        exp_alerts: []
      - alertname: AtlasCoreMetricsMissing
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mongodb_atlas_production
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#core-metrics-missing"
              summary: "Atlas targets are up but core metrics are missing"
              description: "Job mongodb_atlas_production scrapes succeed but inputs to the recording rules are absent. Metric names or relabel filters likely do not match this Atlas project; dependent alerts will never fire."

  # No Atlas targets at all.
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus",instance="localhost:9090"}'
        values: '1x20'
    alert_rule_test:
      - alertname: AtlasScrapeTargetsMissing
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#scrape-targets-missing"
              summary: "No Atlas scrape targets discovered"
              description: "Atlas HTTP service discovery returned no targets. All Atlas alerts are blind."

  # Disk usage from Atlas hardware metrics: 96% used -> critical.
  - interval: 1m
    input_series:
      - series: 'hardware_disk_metrics_disk_space_used_bytes{job="atlas",cl_name="c1",instance="n1:27017",process_port="27017",node_type="ELECTABLE",disk_name="data"}'
        values: '96x10'
      - series: 'hardware_disk_metrics_disk_space_free_bytes{job="atlas",cl_name="c1",instance="n1:27017",process_port="27017",node_type="ELECTABLE",disk_name="data"}'
        values: '4x10'
    alert_rule_test:
      - alertname: AtlasDiskUsageCritical
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: critical
              signal: disk_usage
              job: atlas
              cl_name: c1
              instance: "n1:27017"
              node_type: ELECTABLE
              disk_name: data
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#disk-usage"
              summary: "Atlas disk usage above 95%"
              description: "Node n1:27017 disk data is near full and storage auto-scaling has not caught up. Atlas can block writes when disk is full."
              context: "cluster=c1 rs= instance=n1:27017 node_type=ELECTABLE rs_state= az= region="

  # Normalized CPU from hardware counters: (1200 + 600) ms/s over 2 CPUs = 90%.
  # mongod and mongos on the same host (different process_port) must not
  # double-count system CPU.
  - interval: 1m
    input_series:
      - series: 'hardware_platform_num_logical_cpus{job="atlas",instance="n1:27017",process_port="27017"}'
        values: '2x10'
      - series: 'hardware_platform_num_logical_cpus{job="atlas",instance="n1:27017",process_port="27016"}'
        values: '2x10'
      - series: 'hardware_system_cpu_user_milliseconds{job="atlas",instance="n1:27017",process_port="27017"}'
        values: '0+72000x10'
      - series: 'hardware_system_cpu_user_milliseconds{job="atlas",instance="n1:27017",process_port="27016"}'
        values: '0+72000x10'
      - series: 'hardware_system_cpu_kernel_milliseconds{job="atlas",instance="n1:27017",process_port="27017"}'
        values: '0+36000x10'
      - series: 'hardware_system_cpu_idle_milliseconds{job="atlas",instance="n1:27017",process_port="27017"}'
        values: '0+12000x10'
    promql_expr_test:
      - expr: node:mongodb_system_cpu_normalized:percent
        eval_time: 10m
        exp_samples:
          - labels: 'node:mongodb_system_cpu_normalized:percent{job="atlas",instance="n1:27017"}'
            value: 90

  # Replication: the secondary is 100s behind the primary. Headroom is
  # measured against the primary's oplog (earliest entry 1000), not the
  # secondary's own larger window: 1500 - 1000 = 500s.
  - interval: 1m
    input_series:
      - series: 'mongodb_oplog_latestOptime{job="atlas",cl_name="c1",rs_nm="rs0",instance="n1:27017",rs_state="1"}'
        values: '1000+60x10'
      - series: 'mongodb_oplog_earliestOptime{job="atlas",cl_name="c1",rs_nm="rs0",instance="n1:27017",rs_state="1"}'
        values: '1000x10'
      - series: 'mongodb_oplog_latestOptime{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="2"}'
        values: '900+60x10'
      - series: 'mongodb_oplog_earliestOptime{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="2"}'
        values: '0x10'
    promql_expr_test:
      - expr: node:mongodb_replication_lag:seconds
        eval_time: 10m
        exp_samples:
          - labels: 'node:mongodb_replication_lag:seconds{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="2"}'
            value: 100
      - expr: node:mongodb_replication_headroom:seconds
        eval_time: 10m
        exp_samples:
          - labels: 'node:mongodb_replication_headroom:seconds{job="atlas",cl_name="c1",rs_nm="rs0",instance="n2:27017",rs_state="2"}'
            value: 500
    alert_rule_test:
      - alertname: AtlasReplicationLagHigh
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: warning
              signal: replication_lag
              job: atlas
              cl_name: c1
              rs_nm: rs0
              instance: "n2:27017"
              rs_state: "2"
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#replication-lag"
              summary: "Atlas replication lag above 60s"
              description: "Secondary n2:27017 is 1m 40s behind the primary. Majority writes and secondary reads are affected."
              context: "cluster=c1 rs=rs0 instance=n2:27017 node_type= rs_state=2 az= region="
      - alertname: AtlasReplicationLagCritical
        eval_time: 10m
        exp_alerts: []
      - alertname: AtlasReplicationHeadroomCritical
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: critical
              signal: replication_headroom
              job: atlas
              cl_name: c1
              rs_nm: rs0
              instance: "n2:27017"
              rs_state: "2"
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#replication-headroom"
              summary: "Atlas replication headroom below 1h"
              description: "Secondary n2:27017 is close to falling off the oplog."
              context: "cluster=c1 rs=rs0 instance=n2:27017 node_type= rs_state=2 az= region="

  # Query targeting: an idle node scanning ~120 docs/s while returning <1/s
  # must not alert; the same ratio under real load must.
  - interval: 1m
    input_series:
      - series: 'mongodb_metrics_queryExecutor_scannedObjects{job="atlas",instance="idle:27017",node_type="ELECTABLE"}'
        values: '0+7200x15'
      - series: 'mongodb_metrics_document_returned{job="atlas",instance="idle:27017",node_type="ELECTABLE"}'
        values: '0+42x15'
      - series: 'mongodb_metrics_queryExecutor_scannedObjects{job="atlas",instance="busy:27017",node_type="ELECTABLE"}'
        values: '0+720000x15'
      - series: 'mongodb_metrics_document_returned{job="atlas",instance="busy:27017",node_type="ELECTABLE"}'
        values: '0+4200x15'
    alert_rule_test:
      - alertname: AtlasQueryTargetingRatioHigh
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              severity: warning
              signal: query_targeting
              job: atlas
              instance: "busy:27017"
              node_type: ELECTABLE
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#query-targeting"
              summary: "Atlas query targeting ratio above 100"
              description: "Node busy:27017 is scanning more than 100 documents per returned document. Check indexes and query shapes."
              context: "cluster= rs= instance=busy:27017 node_type=ELECTABLE rs_state= az= region="

  # WiredTiger: 25% dirty -> critical (the warning is inhibited by Alertmanager,
  # not by the rule, so it fires too); 90% fill is below the full threshold.
  - interval: 1m
    input_series:
      - series: 'mongodb_wiredTiger_cache_tracked_dirty_bytes_in_the_cache{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '25x15'
      - series: 'mongodb_wiredTiger_cache_bytes_currently_in_the_cache{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '90x15'
      - series: 'mongodb_wiredTiger_cache_maximum_bytes_configured{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '100x15'
    alert_rule_test:
      - alertname: AtlasWiredTigerDirtyCacheCritical
        eval_time: 12m
        exp_alerts:
          - exp_labels:
              severity: critical
              signal: wt_dirty_cache
              job: atlas
              instance: "n1:27017"
              node_type: ELECTABLE
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#wiredtiger-cache"
              summary: "Atlas WiredTiger dirty cache above 20%"
              description: "Node n1:27017 dirty data is 25% of the cache. Application threads are doing eviction, which adds latency."
              context: "cluster= rs= instance=n1:27017 node_type=ELECTABLE rs_state= az= region="
      - alertname: AtlasWiredTigerCacheFull
        eval_time: 12m
        exp_alerts: []

  # Execution tickets: read tickets exhausted (7.0 metric name), write tickets
  # available (queues.execution metric name) -> one alert, for reads.
  - interval: 1m
    input_series:
      - series: 'mongodb_wiredTiger_concurrentTransactions_read_available{job="atlas",instance="n1:27017",node_type="ELECTABLE"}'
        values: '0x10'
      - series: 'mongodb_queues_execution_write_available{job="atlas",instance="n2:27017",node_type="ELECTABLE"}'
        values: '5x10'
    alert_rule_test:
      - alertname: AtlasExecutionTicketsExhausted
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: critical
              signal: tickets
              job: atlas
              instance: "n1:27017"
              node_type: ELECTABLE
              op: read
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#execution-tickets"
              summary: "Atlas read execution tickets exhausted"
              description: "Node n1:27017 has had no read tickets available for 5m. New operations are queuing."
              context: "cluster= rs= instance=n1:27017 node_type=ELECTABLE rs_state= az= region="

  # Org-wide: project A has all core inputs, project B has none. Only B alerts.
  - interval: 1m
    input_series:
      - series: 'up{job="mongodb_atlas_org_a",instance="a1:27017"}'
        values: '1x20'
      - series: 'up{job="mongodb_atlas_org_b",instance="b1:27017"}'
        values: '1x20'
      - series: 'mongodb_connections_current{job="mongodb_atlas_org_a",instance="a1:27017"}'
        values: '1x20'
      - series: 'mongodb_opcounters_query{job="mongodb_atlas_org_a",instance="a1:27017"}'
        values: '1x20'
      - series: 'mongodb_oplog_latestOptime{job="mongodb_atlas_org_a",instance="a1:27017"}'
        values: '1x20'
      - series: 'hardware_disk_metrics_disk_space_used_bytes{job="mongodb_atlas_org_a",instance="a1:27017"}'
        values: '1x20'
    alert_rule_test:
      - alertname: AtlasCoreMetricsMissing
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mongodb_atlas_org_b
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#core-metrics-missing"
              summary: "Atlas targets are up but core metrics are missing"
              description: "Job mongodb_atlas_org_b scrapes succeed but inputs to the recording rules are absent. Metric names or relabel filters likely do not match this Atlas project; dependent alerts will never fire."

  # CPU: 60% busy plus 30% steal (M10 out of burst credits). Saturation
  # ignores steal (60% < 80%); the steal alert fires.
  - interval: 1m
    input_series:
      - series: 'hardware_platform_num_logical_cpus{job="atlas",instance="n1:27017",process_port="27017",node_type="ELECTABLE"}'
        values: '2x20'
      - series: 'hardware_system_cpu_user_milliseconds{job="atlas",instance="n1:27017",process_port="27017",node_type="ELECTABLE"}'
        values: '0+72000x20'
      - series: 'hardware_system_cpu_steal_milliseconds{job="atlas",instance="n1:27017",process_port="27017",node_type="ELECTABLE"}'
        values: '0+36000x20'
    alert_rule_test:
      - alertname: AtlasCpuSaturationHigh
        eval_time: 20m
        exp_alerts: []
      - alertname: AtlasCpuStealHigh
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              signal: cpu_steal
              job: atlas
              instance: "n1:27017"
              node_type: ELECTABLE
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#cpu-steal"
              summary: "Atlas CPU steal above 20%"
              description: "Node n1:27017 loses 30% of its CPU to steal. On M10/M20 this means burst credits are used up."
              context: "cluster= rs= instance=n1:27017 node_type=ELECTABLE rs_state= az= region="

  # Disk just over 50% used, free space dropping 1 byte/min: full in ~16h,
  # well before the fixed thresholds trigger.
  - interval: 1m
    input_series:
      - series: 'hardware_disk_metrics_disk_space_used_bytes{job="atlas",instance="n1:27017",process_port="27017",node_type="ELECTABLE",disk_name="data"}'
        values: '1000+1x60'
      - series: 'hardware_disk_metrics_disk_space_free_bytes{job="atlas",instance="n1:27017",process_port="27017",node_type="ELECTABLE",disk_name="data"}'
        values: '1000-1x60'
    alert_rule_test:
      - alertname: AtlasDiskWillFillIn24h
        eval_time: 50m
        exp_alerts:
          - exp_labels:
              severity: warning
              signal: disk_usage
              job: atlas
              instance: "n1:27017"
              node_type: ELECTABLE
              disk_name: data
            exp_annotations:
              runbook_url: "https://github.com/alxmancilla/prometheus_integration/blob/main/docs/runbooks.md#disk-usage"
              summary: "Atlas disk projected to fill within 24h"
              description: "Node n1:27017 disk data is growing fast enough to fill within 24 hours."
              context: "cluster= rs= instance=n1:27017 node_type=ELECTABLE rs_state= az= region="
