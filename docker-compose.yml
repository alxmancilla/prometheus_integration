# Atlas + Prometheus + Grafana + Alertmanager stack.
#
# Usage:
#   1. cp secrets/atlas_password.example secrets/atlas_password
#      and edit it with your Atlas Prometheus password.
#      (prometheus-atlas.yml uses atlas_password_production and
#      atlas_password_staging instead, one per Atlas project.)
#   2. Edit prometheus.yml (or prometheus-atlas.yml) and replace the
#      Atlas username and group ID placeholders.
#   3. cp .env.example .env and adjust Grafana admin credentials.
#   4. Replace the placeholder receivers in alertmanager.yml.
#   5. docker compose up -d
#
# Ports are bound to 127.0.0.1. Prometheus and Alertmanager have no
# authentication; put them behind a reverse proxy before exposing them.

services:

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # AtlasSystemMemoryAvailableLow uses a 7-day baseline; keep more than that.
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      # Allows config reloads via: curl -X POST localhost:9090/-/reload
      - "--web.enable-lifecycle"
    volumes:
      # Default: minimal config. To use the advanced config instead, comment
      # the first line and uncomment the prometheus-atlas.yml line below.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # - ./prometheus-atlas.yml:/etc/prometheus/prometheus.yml:ro
      - ./atlas_recording_rules.yml:/etc/prometheus/rules/atlas_recording_rules.yml:ro
      - ./atlas_alerting_rules.yml:/etc/prometheus/rules/atlas_alerting_rules.yml:ro
      - ./atlas_meta_alerting_rules.yml:/etc/prometheus/rules/atlas_meta_alerting_rules.yml:ro
      # The container runs as nobody (65534); the secret must be readable by it.
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
